llm:
  provider: openai
  model: gpt-5.4
  temperature: 0.7
  maxTokens: 2048

retrieval:
  enabled: true
  mode: hybrid    # simple | hybrid（第二十章 20.2：默认 hybrid = 向量+BM25 多召回 → embedding 重排）
  topK: 5

tools:
  enableWordCount: true
  enableKeywordExtract: true

features:
  enableStructuredOutput: false
  enableStreaming: true
