name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每天 02:00 UTC（北京时间 10:00）跑一次 nightly eval
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      run_browser_e2e:
        description: "Run the full browser E2E release gate"
        required: false
        type: boolean
        default: false

jobs:
  # ── 每次 PR / push 跑：便宜、确定、不花钱的门禁 ──
  ci:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      # 仅用于 migrate deploy 验证 migration 文件（Layer 1 测试全 mock、不连真库）
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autix_chat
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/autix_chat
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      # 顺序：便宜的先跑、最容易挂的先挂、失败早退
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Migrate (validate migration files on a clean DB)
        run: bunx prisma migrate deploy
        working-directory: services/chat
      - name: Test (Layer 2 LLM 用例无 key/flag 自动跳过)
        run: bun run test
      - name: Build
        run: bun run build

  # ── nightly / 手动：贵、有波动、烧 token 的质量门禁，不卡每个 PR ──
  eval:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      # run-eval.ts 退出码非 0 → job 失败（第十七章的质量门禁）
      - name: Run eval gate
        run: bun run scripts/run-eval.ts
        working-directory: services/chat
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: services/chat/eval/reports/

  # ── nightly / 手动：真实浏览器 E2E，覆盖登录、SSE、持久化和 Artifact 面板 ──
  browser-e2e:
    if: (github.event_name == 'schedule' && vars.RUN_BROWSER_E2E == '1') || (github.event_name == 'workflow_dispatch' && (inputs.run_browser_e2e || vars.RUN_BROWSER_E2E == '1'))
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: postgres
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      JWT_SECRET: your-super-secret-key-min-32-chars-change-in-production
      RUN_BROWSER_E2E: "1"
      E2E_WEB_URL: http://localhost:3002
      E2E_CHAT_API_URL: http://localhost:4001
      E2E_USER_API_URL: http://localhost:4002/api
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Start full stack
        run: docker compose up --build -d
        working-directory: infra/compose
      - name: Wait for web
        run: bunx wait-on http://localhost:3002 http://localhost:4001/ready tcp:4002 --timeout 180000
      - name: Run browser E2E
        run: bun run test:e2e
      - name: Stop full stack
        if: always()
        run: docker compose down -v
        working-directory: infra/compose
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

  # ── 构建并推送镜像到 GHCR（仅 main push，且 ci 门禁通过后才跑）──
  docker:
    if: github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: chat
            dockerfile: infra/compose/Dockerfile.chat
          - name: user-system
            dockerfile: infra/compose/Dockerfile.user-system
          - name: web
            dockerfile: infra/compose/Dockerfile.web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
