# infra/compose/compose.yaml — 单机一键起：数据存储 + 评测服务 + 迁移 + 应用
# 端口对齐实际：chat 4001、web 3002。健康检查打第十六章的 /ready（真探 DB）。
# 用法：在本文件目录放 .env（POSTGRES_PASSWORD / OPENAI_API_KEY[/ OPENAI_BASE_URL]），再 docker compose up

services:
  postgres:
    image: pgvector/pgvector:pg16 # 带 pgvector 扩展，chat 的向量检索要用
    environment:
      POSTGRES_DB: autix_chat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant: # 可选：Qdrant 向量库路径。chat 默认走 pgvector，此服务供 Qdrant-backed 检索备用
    image: qdrant/qdrant
    ports:
      - "6333:6333"

  ragas: # 第十七章的本地 RAGAS 评测服务（faithfulness）
    build:
      context: ./ragas
    ports:
      - "7860:7860"

  migrate: # 一次性 init 容器：跑完 prisma migrate deploy 即退出，不常驻
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.chat
    command: sh -c "cd /app/services/chat && bunx prisma migrate deploy"
    depends_on:
      migrate-user-system:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/autix_chat"
    restart: "no"

  migrate-user-system: # 一次性 init 容器：用户系统 Prisma 迁移
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.user-system
    command: sh -c "cd /app/packages/database && bunx prisma migrate deploy"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/autix_chat"
    restart: "no"

  seed-user-system: # 一次性 init 容器：为登录页准备 admin / Admin@123456 等基础账号
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.user-system
    command: sh -c "cd /app/packages/database && bun run prisma/seed.ts"
    depends_on:
      migrate-user-system:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/autix_chat"
    restart: "no"

  user-system:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.user-system
    ports:
      - "4002:4002"
    depends_on:
      postgres:
        condition: service_healthy
      seed-user-system:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/autix_chat"
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-key-min-32-chars-change-in-production}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-1d}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      PORT: 4002

  chat:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.chat
    ports:
      - "4001:4001" # 端口对齐实际
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully # 等迁移跑完再起
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/autix_chat"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-key-min-32-chars-change-in-production}
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:4001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.web
      args:
        NEXT_PUBLIC_CHAT_API_URL: http://localhost:4001
        NEXT_PUBLIC_USER_API_URL: http://localhost:4002/api
    ports:
      - "3002:3002" # 端口对齐实际
    depends_on:
      chat:
        condition: service_healthy
      user-system:
        condition: service_started
    environment:
      NEXT_PUBLIC_CHAT_API_URL: http://localhost:4001
      NEXT_PUBLIC_USER_API_URL: http://localhost:4002/api

volumes:
  pgdata: {}
